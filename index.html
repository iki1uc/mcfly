<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AMIGA · Transwarp Gate · Mini‑Cube Move</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:sans-serif;
  }
  canvas {
    background:#000;
  }
</style>
</head>
<body>

<canvas id="scene" width="600" height="400"></canvas>

<script>
const c = document.getElementById("scene");
const ctx = c.getContext("2d");

let cube = {
  x: 100,
  y: c.height/2,
  size: 20,
  scale: 1,
  speed: 2,
  entering: false,
  alpha: 1
};

const gate = {
  x: 450,
  y: c.height/2,
  r: 60,
  wave: 0
};

function drawGate() {
  gate.wave += 0.05;

  // Wasser‑Membran (fast unsichtbar)
  const grd = ctx.createRadialGradient(
    gate.x, gate.y, gate.r * 0.2,
    gate.x, gate.y, gate.r * 1.2
  );
  grd.addColorStop(0, "rgba(100,150,255,0.15)");
  grd.addColorStop(0.5, "rgba(100,150,255,0.05)");
  grd.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(gate.x, gate.y, gate.r + Math.sin(gate.wave)*3, 0, Math.PI*2);
  ctx.fill();

  // Schimmernder Rand
  ctx.strokeStyle = "rgba(150,200,255,0.25)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(gate.x, gate.y, gate.r + Math.sin(gate.wave)*2, 0, Math.PI*2);
  ctx.stroke();
}

function drawCube() {
  ctx.save();
  ctx.globalAlpha = cube.alpha;

  const s = cube.size * cube.scale;

  ctx.fillStyle = "#44ccff";
  ctx.fillRect(cube.x - s/2, cube.y - s/2, s, s);

  ctx.restore();
}

function update() {
  ctx.clearRect(0,0,c.width,c.height);

  drawGate();
  drawCube();

  // Bewegung
  if (!cube.entering) {
    cube.x += cube.speed;

    // Kontakt mit Tor
    if (cube.x >= gate.x - gate.r) {
      cube.entering = true;
    }
  } else {
    // 4× Vergrößerung
    if (cube.scale < 4) cube.scale += 0.1;

    // Fade‑Out
    cube.alpha -= 0.03;

    // Einsaugen
    cube.x += 1;
    cube.y += Math.sin(cube.x * 0.1) * 0.5;
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
